[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selective-newton-muon"
version = "0.1.0"
description = "Model-agnostic selective Newton preconditioning for Muon-family optimizers"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.3"]

[project.optional-dependencies]
experiments = ["datasets", "numpy", "pandas", "requests", "tiktoken", "wandb"]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
