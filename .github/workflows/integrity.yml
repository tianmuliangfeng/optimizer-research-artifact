name: artifact-integrity

on:
  push:
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Reproduction and release tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell syntax
        run: |
          find commands scripts -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n
      - name: Anonymous submission and compact evidence gates
        run: python -B tools/validate_anonymous_submission.py .
      - name: Repository-level checksums
        run: sha256sum --check SHA256SUMS
